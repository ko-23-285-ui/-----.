<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Base с авторизацией</title>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #f4f7ff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            margin: 0;
        }
        .container { 
            width: 100%; 
            max-width: 500px; 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            width: 100%; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 14px;
            margin: 5px 0;
        }
        button:hover { 
            background: #0056b3; 
        }
        .google-btn {
            background: #fff;
            color: #333;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .google-btn:hover {
            background: #f8f8f8;
        }
        .google-btn img {
            width: 20px;
            height: 20px;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin: 10px 0;
            text-align: center;
            padding: 10px;
            background: #f8d7da;
            border-radius: 8px;
        }
        .success-message {
            color: #28a745;
            font-size: 14px;
            margin: 10px 0;
            text-align: center;
            padding: 10px;
            background: #d4edda;
            border-radius: 8px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📝 Тест входа через Google</h1>
    
    <button id="googleLoginBtn" class="google-btn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        Войти через Google
    </button>
    
    <button id="logoutBtn" style="display: none; background: #dc3545;">Выйти</button>
    
    <div id="userInfo" class="user-info" style="display: none;">
        <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
        <div>
            <div id="userName"></div>
            <div id="userEmail" style="color: #666; font-size: 12px;"></div>
        </div>
    </div>
    
    <div id="errorMessage" class="error-message" style="display: none;"></div>
    <div id="successMessage" class="success-message" style="display: none;"></div>
    
    <div id="debugInfo" style="margin-top: 20px; font-size: 12px; color: #666; border-top: 1px solid #ddd; padding-top: 10px;">
        <div>Статус: <span id="authStatus">Не авторизован</span></div>
        <div>Домен: <span id="currentDomain"></span></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDo12JNv3DE4-mI9kLt3zjUUzFAWfVN_9w",
        authDomain: "add-project-f9a29.firebaseapp.com",
        projectId: "add-project-f9a29",
        storageBucket: "add-project-f9a29.firebasestorage.app",
        messagingSenderId: "855957373870",
        appId: "1:855957373870:web:8de42909e143333c853e3f",
        measurementId: "G-FXJF6VKFVC"
    };

    // Инициализация Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    // Настройка провайдера Google
    const provider = new GoogleAuthProvider();
    
    // Добавляем дополнительные параметры для выбора аккаунта
    provider.setCustomParameters({
        prompt: 'select_account'
    });

    // Элементы DOM
    const googleLoginBtn = document.getElementById('googleLoginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userInfo = document.getElementById('userInfo');
    const userAvatar = document.getElementById('userAvatar');
    const userName = document.getElementById('userName');
    const userEmail = document.getElementById('userEmail');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const authStatus = document.getElementById('authStatus');
    const currentDomain = document.getElementById('currentDomain');

    // Показываем текущий домен
    currentDomain.textContent = window.location.origin;

    // Функция для показа ошибки
    function showError(text) {
        console.error('Ошибка:', text);
        errorMessage.textContent = text;
        errorMessage.style.display = 'block';
        setTimeout(() => {
            errorMessage.style.display = 'none';
        }, 5000);
    }

    // Функция для показа успеха
    function showSuccess(text) {
        successMessage.textContent = text;
        successMessage.style.display = 'block';
        setTimeout(() => {
            successMessage.style.display = 'none';
        }, 3000);
    }

    // Обработчик изменения состояния аутентификации
    onAuthStateChanged(auth, (user) => {
        if (user) {
            console.log('Пользователь вошел:', user);
            authStatus.textContent = 'Авторизован как ' + user.email;
            
            googleLoginBtn.style.display = 'none';
            logoutBtn.style.display = 'block';
            userInfo.style.display = 'flex';
            
            userAvatar.src = user.photoURL || 'https://via.placeholder.com/40';
            userName.textContent = user.displayName || 'Пользователь';
            userEmail.textContent = user.email;
            
            showSuccess('Вход выполнен успешно!');
        } else {
            console.log('Пользователь вышел');
            authStatus.textContent = 'Не авторизован';
            
            googleLoginBtn.style.display = 'block';
            logoutBtn.style.display = 'none';
            userInfo.style.display = 'none';
        }
    });

    // Обработчик входа через Google
    googleLoginBtn.addEventListener('click', async () => {
        try {
            console.log('Начинаем вход через Google...');
            errorMessage.style.display = 'none';
            
            // Пробуем войти через popup
            const result = await signInWithPopup(auth, provider);
            
            console.log('Результат входа:', result);
            showSuccess('Вход выполнен!');
            
        } catch (error) {
            console.error('Детальная ошибка входа:', error);
            
            // Обработка различных ошибок
            let errorText = 'Ошибка входа: ';
            
            switch (error.code) {
                case 'auth/popup-blocked':
                    errorText += 'Всплывающее окно заблокировано. Разрешите всплывающие окна для этого сайта.';
                    break;
                case 'auth/popup-closed-by-user':
                    errorText += 'Окно входа было закрыто. Попробуйте снова.';
                    break;
                case 'auth/cancelled-popup-request':
                    errorText += 'Запрос отменен.';
                    break;
                case 'auth/unauthorized-domain':
                    errorText += 'Этот домен не авторизован. Добавьте ' + window.location.origin + ' в Firebase Console.';
                    break;
                case 'auth/operation-not-allowed':
                    errorText += 'Вход через Google не включен в Firebase Console.';
                    break;
                default:
                    errorText += error.message;
            }
            
            showError(errorText);
        }
    });

    // Обработчик выхода
    logoutBtn.addEventListener('click', async () => {
        try {
            await signOut(auth);
            showSuccess('Выход выполнен');
        } catch (error) {
            showError('Ошибка выхода: ' + error.message);
        }
    });
    
    // Альтернативный метод входа через redirect (если popup не работает)
    async function loginWithRedirect() {
        try {
            await signInWithRedirect(auth, provider);
        } catch (error) {
            showError('Ошибка входа через redirect: ' + error.message);
        }
    }
    
    // Можно добавить кнопку для входа через redirect
    const redirectBtn = document.createElement('button');
    redirectBtn.textContent = 'Войти через Google (redirect)';
    redirectBtn.style.marginTop = '10px';
    redirectBtn.style.background = '#28a745';
    redirectBtn.onclick = loginWithRedirect;
    document.querySelector('.container').appendChild(redirectBtn);
</script>
</body>
</html>
