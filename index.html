<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Base с авторизацией и DM</title>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #f4f7ff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            margin: 0;
        }
        .container { 
            width: 100%; 
            max-width: 500px; 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        input, textarea, select { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border: 1px solid #e0e0e0; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 14px;
        }
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            width: 100%; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 14px;
            margin: 5px 0;
        }
        button:hover { 
            background: #0056b3; 
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .logout-btn {
            background: #dc3545;
        }
        .logout-btn:hover {
            background: #b02a37;
        }
        .switch-account-btn {
            background: #6c757d;
        }
        .switch-account-btn:hover {
            background: #5a6268;
        }
        .auth-section {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .auth-section button {
            flex: 1;
            min-width: 120px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .user-email {
            flex: 1;
            font-size: 14px;
            color: #333;
            word-break: break-all;
        }
        .guest-message {
            color: #666;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
        .form-section {
            transition: all 0.3s;
        }
        .post { 
            background: #f8f9fa; 
            padding: 15px; 
            border-radius: 8px; 
            margin: 10px 0; 
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .post-author {
            font-weight: 600;
            color: #007bff;
            cursor: pointer;
        }
        .post-author:hover {
            text-decoration: underline;
        }
        .post-time { 
            color: #666; 
            font-size: 12px; 
        }
        .post-content {
            margin: 10px 0;
            word-break: break-word;
        }
        .post-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .post-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .like-btn { 
            background: none; 
            color: #666; 
            border: 1px solid #ddd; 
            padding: 5px 15px; 
            width: auto; 
            border-radius: 20px; 
            font-size: 13px;
        }
        .like-btn:hover { 
            background: #e3f2fd; 
            color: #1976d2; 
        }
        .dm-btn {
            background: none;
            color: #28a745;
            border: 1px solid #28a745;
            padding: 5px 15px;
            width: auto;
            border-radius: 20px;
            font-size: 13px;
        }
        .dm-btn:hover {
            background: #28a745;
            color: white;
        }
        .list { 
            list-style-type: none; 
            margin: 20px 0 0; 
            padding: 0; 
        }
        h1 { 
            font-size: 24px; 
            color: #333; 
            margin-bottom: 20px; 
        }
        
        /* Стили для DM */
        .dm-section {
            margin: 20px 0;
            border-top: 2px solid #e0e0e0;
            padding-top: 20px;
        }
        .dm-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .dm-tab {
            flex: 1;
            background: #f0f0f0;
            color: #333;
        }
        .dm-tab.active {
            background: #007bff;
            color: white;
        }
        .dm-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
        }
        .dm-item {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: 0.2s;
        }
        .dm-item:hover {
            background: #f0f0f0;
        }
        .dm-item.unread {
            background: #e3f2fd;
            font-weight: 600;
        }
        .dm-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .dm-sender {
            font-weight: 600;
            color: #007bff;
        }
        .dm-preview {
            color: #666;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dm-time {
            color: #999;
            font-size: 11px;
        }
        .dm-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .dm-modal-content {
            position: relative;
            background: white;
            width: 90%;
            max-width: 500px;
            margin: 50px auto;
            border-radius: 12px;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .dm-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }
        .dm-close:hover {
            color: #333;
        }
        .dm-messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
        }
        .dm-message {
            margin: 5px 0;
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 70%;
            word-wrap: break-word;
        }
        .dm-message.sent {
            background: #007bff;
            color: white;
            align-self: flex-end;
        }
        .dm-message.received {
            background: #f0f0f0;
            color: #333;
            align-self: flex-start;
        }
        .dm-message-time {
            font-size: 10px;
            color: #999;
            margin-top: 2px;
            text-align: right;
        }
        .dm-input-area {
            display: flex;
            gap: 10px;
        }
        .dm-input-area input {
            flex: 1;
            margin: 0;
        }
        .dm-input-area button {
            width: auto;
            padding: 12px 20px;
        }
        .unread-badge {
            background: #dc3545;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 10px;
            margin-left: 5px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin: 10px 0;
            text-align: center;
            padding: 10px;
            background: #f8d7da;
            border-radius: 8px;
        }
        .success-message {
            color: #28a745;
            font-size: 14px;
            margin: 10px 0;
            text-align: center;
            padding: 10px;
            background: #d4edda;
            border-radius: 8px;
        }
        .retry-btn {
            background: #ffc107;
            color: #333;
            margin-top: 10px;
        }
        .retry-btn:hover {
            background: #e0a800;
        }
        .info-text {
            color: #666;
            font-size: 12px;
            margin: 5px 0;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>📝 Вопросы и личные сообщения</h1>
    
    <div id="authSection" class="auth-section">
        <button id="loginBtn">🔐 Войти через Google</button>
        <button id="logoutBtn" class="logout-btn" style="display: none;">🚪 Выйти</button>
        <button id="switchAccountBtn" class="switch-account-btn" style="display: none;">🔄 Сменить аккаунт</button>
    </div>

    <div id="userInfo" class="user-info" style="display: none;">
        <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
        <span id="userEmail" class="user-email"></span>
    </div>

    <!-- DM Секция -->
    <div id="dmSection" class="dm-section" style="display: none;">
        <div class="dm-tabs">
            <button id="dmListTab" class="dm-tab active">📬 Диалоги</button>
            <button id="newDmTab" class="dm-tab">✉️ Новое сообщение</button>
        </div>
        
        <!-- Список диалогов -->
        <div id="dmListContainer">
            <div id="dmList" class="dm-list">
                <div class="loading">Загрузка диалогов...</div>
            </div>
            <div id="dmError" class="error-message" style="display: none;"></div>
            <button id="retryLoadDmBtn" class="retry-btn" style="display: none;">🔄 Повторить загрузку</button>
        </div>
        
        <!-- Форма нового сообщения -->
        <div id="newDmContainer" style="display: none;">
            <select id="dmRecipient">
                <option value="">Загрузка пользователей...</option>
            </select>
            <textarea id="dmMessage" placeholder="Текст сообщения..." rows="3"></textarea>
            <button id="sendDmBtn">📨 Отправить</button>
        </div>
    </div>

    <!-- Форма для вопросов -->
    <div id="formSection" class="form-section" style="display: none;">
        <input type="text" id="name" placeholder="Ваше имя" required>
        <textarea id="message" placeholder="Ваш вопрос" rows="3" required></textarea>
        
        <input type="file" id="imageUpload" accept="image/*">
        <div id="imagePreview" style="margin: 10px 0; display: none;">
            <img id="previewImg" style="max-width: 100%; max-height: 150px; border-radius: 8px;">
        </div>
        
        <button id="submitBtn">📤 Отправить вопрос</button>
    </div>

    <div id="guestMessage" class="guest-message" style="display: none;">
        👋 Пожалуйста, войдите через Google, чтобы задать вопрос
    </div>

    <!-- Лента постов -->
    <div id="feed" class="list"></div>
</div>

<!-- Модальное окно для DM -->
<div id="dmModal" class="dm-modal">
    <div class="dm-modal-content">
        <span class="dm-close" onclick="closeDmModal()">&times;</span>
        <h3 id="dmModalTitle">Личные сообщения</h3>
        <div id="dmMessages" class="dm-messages">
            <div class="loading">Загрузка сообщений...</div>
        </div>
        <div class="dm-input-area">
            <input type="text" id="dmInput" placeholder="Введите сообщение..." autocomplete="off">
            <button id="sendMessageBtn">Отправить</button>
        </div>
        <div id="dmChatError" class="error-message" style="display: none;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, updateDoc, increment, where, getDocs, getDoc, setDoc, limit } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDo12JNv3DE4-mI9kLt3zjUUzFAWfVN_9w",
        authDomain: "add-project-f9a29.firebaseapp.com",
        projectId: "add-project-f9a29",
        storageBucket: "add-project-f9a29.firebasestorage.app",
        messagingSenderId: "855957373870",
        appId: "1:855957373870:web:8de42909e143333c853e3f",
        measurementId: "G-FXJF6VKFVC"
    };

    // Инициализация Firebase с обработкой ошибок
    let app, db, auth, storage, provider;
    
    try {
        app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);
        storage = getStorage(app);
        provider = new GoogleAuthProvider();
        
        // Настройка провайдера для выбора аккаунта
        provider.setCustomParameters({
            prompt: 'select_account'
        });
        
        console.log('Firebase инициализирован успешно');
    } catch (error) {
        console.error('Ошибка инициализации Firebase:', error);
        alert('Ошибка инициализации Firebase. Проверьте конфигурацию.');
    }

    // Элементы интерфейса
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const switchAccountBtn = document.getElementById('switchAccountBtn');
    const userInfo = document.getElementById('userInfo');
    const userAvatar = document.getElementById('userAvatar');
    const userEmail = document.getElementById('userEmail');
    const formSection = document.getElementById('formSection');
    const guestMessage = document.getElementById('guestMessage');
    const submitBtn = document.getElementById('submitBtn');
    const nameInput = document.getElementById('name');
    const messageInput = document.getElementById('message');
    const imageUpload = document.getElementById('imageUpload');
    const imagePreview = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    const feed = document.getElementById('feed');
    const dmError = document.getElementById('dmError');
    const retryLoadDmBtn = document.getElementById('retryLoadDmBtn');
    const dmChatError = document.getElementById('dmChatError');
    
    // DM элементы
    const dmSection = document.getElementById('dmSection');
    const dmListTab = document.getElementById('dmListTab');
    const newDmTab = document.getElementById('newDmTab');
    const dmListContainer = document.getElementById('dmListContainer');
    const newDmContainer = document.getElementById('newDmContainer');
    const dmList = document.getElementById('dmList');
    const dmRecipient = document.getElementById('dmRecipient');
    const dmMessage = document.getElementById('dmMessage');
    const sendDmBtn = document.getElementById('sendDmBtn');
    const dmModal = document.getElementById('dmModal');
    const dmModalTitle = document.getElementById('dmModalTitle');
    const dmMessages = document.getElementById('dmMessages');
    const dmInput = document.getElementById('dmInput');
    const sendMessageBtn = document.getElementById('sendMessageBtn');

    // Состояние DM
    let currentChatUserId = null;
    let currentChatUserName = null;
    let allUsers = [];
    let currentConversationId = null;
    let unsubscribeMessages = null;
    let unsubscribeConversations = null;

    // Предпросмотр изображения
    imageUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                imagePreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        } else {
            imagePreview.style.display = 'none';
        }
    });

    // Авторизация
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            console.log('Пользователь вошел:', user.email);
            loginBtn.style.display = 'none';
            logoutBtn.style.display = 'block';
            switchAccountBtn.style.display = 'block';
            userInfo.style.display = 'flex';
            userAvatar.src = user.photoURL || 'https://via.placeholder.com/40';
            userEmail.textContent = user.email;
            formSection.style.display = 'block';
            guestMessage.style.display = 'none';
            dmSection.style.display = 'block';
            
            if (!nameInput.value) {
                nameInput.value = user.displayName || 'Пользователь';
            }
            
            // Сохраняем пользователя в базу
            await saveUserToFirestore(user);
            await loadAllUsers();
            loadConversations();
        } else {
            console.log('Пользователь вышел');
            loginBtn.style.display = 'block';
            logoutBtn.style.display = 'none';
            switchAccountBtn.style.display = 'none';
            userInfo.style.display = 'none';
            formSection.style.display = 'none';
            guestMessage.style.display = 'block';
            dmSection.style.display = 'none';
            
            // Отписываемся от слушателей
            if (unsubscribeConversations) {
                unsubscribeConversations();
            }
            if (unsubscribeMessages) {
                unsubscribeMessages();
            }
        }
    });

    // Сохранение пользователя в Firestore
    async function saveUserToFirestore(user) {
        try {
            const userRef = doc(db, "users", user.uid);
            await setDoc(userRef, {
                uid: user.uid,
                email: user.email,
                displayName: user.displayName || 'Пользователь',
                photoURL: user.photoURL,
                lastSeen: serverTimestamp()
            }, { merge: true });
            console.log('Пользователь сохранен в Firestore');
        } catch (error) {
            console.error('Ошибка сохранения пользователя:', error);
        }
    }

    // Вход через Google
    loginBtn.addEventListener('click', async () => {
        try {
            const result = await signInWithPopup(auth, provider);
            console.log('Вход выполнен:', result.user.email);
        } catch (error) {
            if (error.code !== 'auth/popup-closed-by-user') {
                console.error('Ошибка входа:', error);
                alert('Ошибка входа: ' + error.message);
            }
        }
    });

    // Смена аккаунта
    switchAccountBtn.addEventListener('click', async () => {
        try {
            await signOut(auth);
            setTimeout(async () => {
                try {
                    await signInWithPopup(auth, provider);
                } catch (error) {
                    if (error.code !== 'auth/popup-closed-by-user') {
                        alert('Ошибка входа: ' + error.message);
                    }
                }
            }, 500);
        } catch (error) {
            console.error('Ошибка при смене аккаунта:', error);
        }
    });

    // Выход
    logoutBtn.addEventListener('click', async () => {
        try {
            await signOut(auth);
        } catch (error) {
            alert('Ошибка выхода: ' + error.message);
        }
    });

    // Загрузка всех пользователей
    async function loadAllUsers() {
        try {
            const usersQuery = query(collection(db, "users"));
            const usersSnapshot = await getDocs(usersQuery);
            
            allUsers = [];
            dmRecipient.innerHTML = '<option value="">Выберите получателя</option>';
            
            usersSnapshot.forEach((doc) => {
                const userData = doc.data();
                if (doc.id !== auth.currentUser?.uid) {
                    allUsers.push({
                        uid: doc.id,
                        ...userData
                    });
                    dmRecipient.innerHTML += `<option value="${doc.id}">${userData.displayName || userData.email}</option>`;
                }
            });
            
            console.log('Загружено пользователей:', allUsers.length);
        } catch (error) {
            console.error('Ошибка загрузки пользователей:', error);
            dmRecipient.innerHTML = '<option value="">Ошибка загрузки</option>';
        }
    }

    // Загрузка диалогов
    function loadConversations() {
        const currentUserId = auth.currentUser?.uid;
        if (!currentUserId) return;
        
        console.log('Загрузка диалогов для пользователя:', currentUserId);
        
        // Скрываем ошибку при новой загрузке
        dmError.style.display = 'none';
        retryLoadDmBtn.style.display = 'none';
        dmList.innerHTML = '<div class="loading">Загрузка диалогов...</div>';
        
        const conversationsQuery = query(
            collection(db, "conversations"),
            where("participants", "array-contains", currentUserId),
            orderBy("lastMessageTime", "desc")
        );
        
        if (unsubscribeConversations) {
            unsubscribeConversations();
        }
        
        unsubscribeConversations = onSnapshot(conversationsQuery, async (snapshot) => {
            console.log('Получены диалоги:', snapshot.size);
            
            if (snapshot.empty) {
                dmList.innerHTML = '<div class="loading">Нет диалогов. Начните общение!</div>';
                return;
            }
            
            dmList.innerHTML = '';
            
            // Собираем все ID пользователей
            const userIds = new Set();
            snapshot.docs.forEach(doc => {
                const data = doc.data();
                data.participants.forEach(id => {
                    if (id !== currentUserId) {
                        userIds.add(id);
                    }
                });
            });
            
            // Загружаем данные пользователей
            const userPromises = Array.from(userIds).map(async (id) => {
                try {
                    const userDoc = await getDoc(doc(db, "users", id));
                    return { id, data: userDoc.exists() ? userDoc.data() : null };
                } catch (error) {
                    console.error(`Ошибка загрузки пользователя ${id}:`, error);
                    return { id, data: null };
                }
            });
            
            const userResults = await Promise.all(userPromises);
            const userMap = {};
            userResults.forEach(({ id, data }) => {
                if (data) {
                    userMap[id] = data;
                }
            });
            
            // Отображаем диалоги
            snapshot.forEach((doc) => {
                const convData = doc.data();
                const otherUserId = convData.participants.find(id => id !== currentUserId);
                const otherUser = userMap[otherUserId] || { displayName: 'Пользователь', email: '' };
                
                const timeStr = convData.lastMessageTime?.toDate ? 
                    convData.lastMessageTime.toDate().toLocaleString() : '';
                
                const unreadCount = convData[`unread_${currentUserId}`] || 0;
                
                const dmItem = document.createElement('div');
                dmItem.className = `dm-item ${unreadCount > 0 ? 'unread' : ''}`;
                dmItem.onclick = () => openChat(otherUserId, otherUser.displayName || otherUser.email);
                
                dmItem.innerHTML = `
                    <div class="dm-header">
                        <span class="dm-sender">${otherUser.displayName || otherUser.email}</span>
                        <span class="dm-time">${timeStr}</span>
                    </div>
                    <div class="dm-preview">
                        ${convData.lastMessage || 'Нет сообщений'}
                        ${unreadCount > 0 ? `<span class="unread-badge">${unreadCount}</span>` : ''}
                    </div>
                `;
                
                dmList.appendChild(dmItem);
            });
        }, (error) => {
            console.error('Ошибка загрузки диалогов:', error);
            dmList.innerHTML = '';
            dmError.style.display = 'block';
            dmError.textContent = 'Ошибка загрузки диалогов: ' + error.message;
            retryLoadDmBtn.style.display = 'block';
        });
    }

    // Повторная загрузка диалогов
    retryLoadDmBtn.addEventListener('click', () => {
        loadConversations();
    });

    // Открыть чат
    async function openChat(userId, userName) {
        if (!auth.currentUser) return;
        
        currentChatUserId = userId;
        currentChatUserName = userName;
        currentConversationId = [auth.currentUser.uid, userId].sort().join('_');
        
        dmModalTitle.textContent = `Чат с ${userName}`;
        dmModal.style.display = 'block';
        dmMessages.innerHTML = '<div class="loading">Загрузка сообщений...</div>';
        dmChatError.style.display = 'none';
        
        // Загружаем сообщения
        await loadMessages();
    }

    // Загрузка сообщений
    async function loadMessages() {
        if (!auth.currentUser || !currentChatUserId || !currentConversationId) return;
        
        if (unsubscribeMessages) {
            unsubscribeMessages();
        }
        
        const messagesQuery = query(
            collection(db, "messages", currentConversationId, "chat"),
            orderBy("timestamp", "asc"),
            limit(100)
        );
        
        unsubscribeMessages = onSnapshot(messagesQuery, async (snapshot) => {
            dmMessages.innerHTML = '';
            dmChatError.style.display = 'none';
            
            if (snapshot.empty) {
                dmMessages.innerHTML = '<div style="text-align: center; color: #666;">Нет сообщений. Напишите что-нибудь!</div>';
            } else {
                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    const messageClass = msg.senderId === auth.currentUser?.uid ? 'sent' : 'received';
                    const timeStr = msg.timestamp?.toDate ? 
                        msg.timestamp.toDate().toLocaleString() : '';
                    
                    const messageEl = document.createElement('div');
                    messageEl.className = `dm-message ${messageClass}`;
                    messageEl.innerHTML = `
                        <div>${msg.text}</div>
                        <div class="dm-message-time">${timeStr}</div>
                    `;
                    
                    dmMessages.appendChild(messageEl);
                });
            }
            
            dmMessages.scrollTop = dmMessages.scrollHeight;
            
            // Отмечаем сообщения как прочитанные
            await markMessagesAsRead();
        }, (error) => {
            console.error('Ошибка загрузки сообщений:', error);
            dmMessages.innerHTML = '';
            dmChatError.style.display = 'block';
            dmChatError.textContent = 'Ошибка загрузки сообщений: ' + error.message;
        });
    }

    // Отметить сообщения как прочитанные
    async function markMessagesAsRead() {
        if (!auth.currentUser || !currentConversationId) return;
        
        const convRef = doc(db, "conversations", currentConversationId);
        
        try {
            const convDoc = await getDoc(convRef);
            if (convDoc.exists()) {
                await updateDoc(convRef, {
                    [`unread_${auth.currentUser.uid}`]: 0
                });
            }
        } catch (error) {
            console.error('Ошибка при отметке прочитанных:', error);
        }
    }

    // Отправить сообщение
    async function sendMessage() {
        const text = dmInput.value.trim();
        if (!text || !currentChatUserId || !auth.currentUser) {
            alert('Введите сообщение');
            return;
        }
        
        const currentUserId = auth.currentUser.uid;
        const conversationId = currentConversationId || [currentUserId, currentChatUserId].sort().join('_');
        
        try {
            console.log('Отправка сообщения:', { text, to: currentChatUserId });
            
            // Сохраняем сообщение
            const messageRef = await addDoc(collection(db, "messages", conversationId, "chat"), {
                senderId: currentUserId,
                receiverId: currentChatUserId,
                text: text,
                timestamp: serverTimestamp(),
                read: false
            });
            
            console.log('Сообщение отправлено, ID:', messageRef.id);
            
            // Обновляем диалог
            const convRef = doc(db, "conversations", conversationId);
            const convDoc = await getDoc(convRef);
            
            if (convDoc.exists()) {
                await updateDoc(convRef, {
                    lastMessage: text,
                    lastMessageTime: serverTimestamp(),
                    [`unread_${currentChatUserId}`]: increment(1)
                });
            } else {
                await setDoc(convRef, {
                    participants: [currentUserId, currentChatUserId],
                    lastMessage: text,
                    lastMessageTime: serverTimestamp(),
                    [`unread_${currentUserId}`]: 0,
                    [`unread_${currentChatUserId}`]: 1,
                    createdAt: serverTimestamp()
                });
            }
            
            dmInput.value = '';
            
        } catch (error) {
            console.error('Детальная ошибка отправки:', error);
            alert('Не удалось отправить сообщение: ' + error.message);
        }
    }
