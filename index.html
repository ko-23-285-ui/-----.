<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Base с авторизацией и DM</title>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #f4f7ff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            margin: 0;
        }
        .container { 
            width: 100%; 
            max-width: 500px; 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        input, textarea, select { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border: 1px solid #e0e0e0; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 14px;
        }
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            width: 100%; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 14px;
            margin: 5px 0;
        }
        button:hover { 
            background: #0056b3; 
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .logout-btn {
            background: #dc3545;
        }
        .logout-btn:hover {
            background: #b02a37;
        }
        .auth-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .auth-section button {
            flex: 1;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .user-email {
            flex: 1;
            font-size: 14px;
            color: #333;
        }
        .guest-message {
            color: #666;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
        .form-section {
            transition: all 0.3s;
        }
        .post { 
            background: #f8f9fa; 
            padding: 15px; 
            border-radius: 8px; 
            margin: 10px 0; 
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .post-author {
            font-weight: 600;
            color: #007bff;
            cursor: pointer;
        }
        .post-author:hover {
            text-decoration: underline;
        }
        .post-time { 
            color: #666; 
            font-size: 12px; 
        }
        .post-content {
            margin: 10px 0;
        }
        .post-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .post-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .like-btn { 
            background: none; 
            color: #666; 
            border: 1px solid #ddd; 
            padding: 5px 15px; 
            width: auto; 
            border-radius: 20px; 
            font-size: 13px;
        }
        .like-btn:hover { 
            background: #e3f2fd; 
            color: #1976d2; 
        }
        .dm-btn {
            background: none;
            color: #28a745;
            border: 1px solid #28a745;
            padding: 5px 15px;
            width: auto;
            border-radius: 20px;
            font-size: 13px;
        }
        .dm-btn:hover {
            background: #28a745;
            color: white;
        }
        .list { 
            list-style-type: none; 
            margin: 20px 0 0; 
            padding: 0; 
        }
        h1 { 
            font-size: 24px; 
            color: #333; 
            margin-bottom: 20px; 
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin: 10px 0;
            text-align: center;
        }
        
        /* Стили для DM */
        .dm-section {
            margin: 20px 0;
            border-top: 2px solid #e0e0e0;
            padding-top: 20px;
        }
        .dm-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .dm-tab {
            flex: 1;
            background: #f0f0f0;
            color: #333;
        }
        .dm-tab.active {
            background: #007bff;
            color: white;
        }
        .dm-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
        }
        .dm-item {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: 0.2s;
        }
        .dm-item:hover {
            background: #f0f0f0;
        }
        .dm-item.unread {
            background: #e3f2fd;
            font-weight: 600;
        }
        .dm-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .dm-sender {
            font-weight: 600;
            color: #007bff;
        }
        .dm-preview {
            color: #666;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dm-time {
            color: #999;
            font-size: 11px;
        }
        .dm-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .dm-modal-content {
            position: relative;
            background: white;
            width: 90%;
            max-width: 500px;
            margin: 50px auto;
            border-radius: 12px;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .dm-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }
        .dm-close:hover {
            color: #333;
        }
        .dm-messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
        }
        .dm-message {
            margin: 5px 0;
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 70%;
            word-wrap: break-word;
        }
        .dm-message.sent {
            background: #007bff;
            color: white;
            align-self: flex-end;
        }
        .dm-message.received {
            background: #f0f0f0;
            color: #333;
            align-self: flex-start;
        }
        .dm-message-time {
            font-size: 10px;
            color: #999;
            margin-top: 2px;
            text-align: right;
        }
        .dm-input-area {
            display: flex;
            gap: 10px;
        }
        .dm-input-area input {
            flex: 1;
            margin: 0;
        }
        .dm-input-area button {
            width: auto;
            padding: 12px 20px;
        }
        .unread-badge {
            background: #dc3545;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 10px;
            margin-left: 5px;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>📝 Вопросы и личные сообщения</h1>
    
    <div id="authSection" class="auth-section">
        <button id="loginBtn">🔐 Войти через Google</button>
        <button id="logoutBtn" class="logout-btn" style="display: none;">🚪 Выйти</button>
    </div>

    <div id="userInfo" class="user-info" style="display: none;">
        <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
        <span id="userEmail" class="user-email"></span>
    </div>

    <!-- DM Секция -->
    <div id="dmSection" class="dm-section" style="display: none;">
        <div class="dm-tabs">
            <button id="dmListTab" class="dm-tab active">📬 Диалоги</button>
            <button id="newDmTab" class="dm-tab">✉️ Новое сообщение</button>
        </div>
        
        <!-- Список диалогов -->
        <div id="dmListContainer">
            <div id="dmList" class="dm-list"></div>
        </div>
        
        <!-- Форма нового сообщения -->
        <div id="newDmContainer" style="display: none;">
            <select id="dmRecipient">
                <option value="">Выберите получателя</option>
            </select>
            <textarea id="dmMessage" placeholder="Текст сообщения..." rows="3"></textarea>
            <button id="sendDmBtn">📨 Отправить</button>
        </div>
    </div>

    <!-- Форма для вопросов -->
    <div id="formSection" class="form-section" style="display: none;">
        <input type="text" id="name" placeholder="Ваше имя" required>
        <textarea id="message" placeholder="Ваш вопрос" rows="3" required></textarea>
        
        <input type="file" id="imageUpload" accept="image/*">
        <div id="imagePreview" style="margin: 10px 0; display: none;">
            <img id="previewImg" style="max-width: 100%; max-height: 150px; border-radius: 8px;">
        </div>
        
        <button id="submitBtn">📤 Отправить вопрос</button>
    </div>

    <div id="guestMessage" class="guest-message" style="display: none;">
        👋 Пожалуйста, войдите через Google, чтобы задать вопрос
    </div>

    <!-- Лента постов -->
    <div id="feed" class="list"></div>
</div>

<!-- Модальное окно для DM -->
<div id="dmModal" class="dm-modal">
    <div class="dm-modal-content">
        <span class="dm-close" onclick="closeDmModal()">&times;</span>
        <h3 id="dmModalTitle">Личные сообщения</h3>
        <div id="dmMessages" class="dm-messages"></div>
        <div class="dm-input-area">
            <input type="text" id="dmInput" placeholder="Введите сообщение...">
            <button id="sendMessageBtn">Отправить</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, updateDoc, increment, where, getDocs, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDo12JNv3DE4-mI9kLt3zjUUzFAWfVN_9w",
        authDomain: "add-project-f9a29.firebaseapp.com",
        projectId: "add-project-f9a29",
        storageBucket: "add-project-f9a29.firebasestorage.app",
        messagingSenderId: "855957373870",
        appId: "1:855957373870:web:8de42909e143333c853e3f",
        measurementId: "G-FXJF6VKFVC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const storage = getStorage(app);
    const provider = new GoogleAuthProvider();

    // Элементы интерфейса
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userInfo = document.getElementById('userInfo');
    const userAvatar = document.getElementById('userAvatar');
    const userEmail = document.getElementById('userEmail');
    const formSection = document.getElementById('formSection');
    const guestMessage = document.getElementById('guestMessage');
    const submitBtn = document.getElementById('submitBtn');
    const nameInput = document.getElementById('name');
    const messageInput = document.getElementById('message');
    const imageUpload = document.getElementById('imageUpload');
    const imagePreview = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    const feed = document.getElementById('feed');
    
    // DM элементы
    const dmSection = document.getElementById('dmSection');
    const dmListTab = document.getElementById('dmListTab');
    const newDmTab = document.getElementById('newDmTab');
    const dmListContainer = document.getElementById('dmListContainer');
    const newDmContainer = document.getElementById('newDmContainer');
    const dmList = document.getElementById('dmList');
    const dmRecipient = document.getElementById('dmRecipient');
    const dmMessage = document.getElementById('dmMessage');
    const sendDmBtn = document.getElementById('sendDmBtn');
    const dmModal = document.getElementById('dmModal');
    const dmModalTitle = document.getElementById('dmModalTitle');
    const dmMessages = document.getElementById('dmMessages');
    const dmInput = document.getElementById('dmInput');
    const sendMessageBtn = document.getElementById('sendMessageBtn');

    // Состояние DM
    let currentChatUserId = null;
    let currentChatUserName = null;
    let allUsers = [];
    let conversations = {};
    let unreadCounts = {};

    // Предпросмотр изображения
    imageUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                imagePreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        } else {
            imagePreview.style.display = 'none';
        }
    });

    // Авторизация
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            loginBtn.style.display = 'none';
            logoutBtn.style.display = 'block';
            userInfo.style.display = 'flex';
            userAvatar.src = user.photoURL || 'https://via.placeholder.com/40';
            userEmail.textContent = user.email;
            formSection.style.display = 'block';
            guestMessage.style.display = 'none';
            dmSection.style.display = 'block';
            
            if (!nameInput.value) {
                nameInput.value = user.displayName || 'Пользователь';
            }
            
            await loadAllUsers();
            await loadConversations(user.uid);
        } else {
            loginBtn.style.display = 'block';
            logoutBtn.style.display = 'none';
            userInfo.style.display = 'none';
            formSection.style.display = 'none';
            guestMessage.style.display = 'block';
            dmSection.style.display = 'none';
        }
    });

    loginBtn.addEventListener('click', async () => {
        try {
            await signInWithPopup(auth, provider);
        } catch (error) {
            alert('Ошибка входа: ' + error.message);
        }
    });

    logoutBtn.addEventListener('click', async () => {
        try {
            await signOut(auth);
        } catch (error) {
            alert('Ошибка выхода: ' + error.message);
        }
    });

    // Загрузка всех пользователей
    async function loadAllUsers() {
        try {
            const usersQuery = query(collection(db, "users"));
            const usersSnapshot = await getDocs(usersQuery);
            
            // Сохраняем текущего пользователя
            const currentUser = auth.currentUser;
            if (currentUser) {
                await setDoc(doc(db, "users", currentUser.uid), {
                    email: currentUser.email,
                    displayName: currentUser.displayName || 'Пользователь',
                    photoURL: currentUser.photoURL,
                    lastSeen: serverTimestamp()
                }, { merge: true });
            }
            
            allUsers = [];
            dmRecipient.innerHTML = '<option value="">Выберите получателя</option>';
            
            usersSnapshot.forEach((doc) => {
                const userData = doc.data();
                if (doc.id !== auth.currentUser?.uid) {
                    allUsers.push({
                        uid: doc.id,
                        ...userData
                    });
                    dmRecipient.innerHTML += `<option value="${doc.id}">${userData.displayName || userData.email}</option>`;
                }
            });
        } catch (error) {
            console.error('Ошибка загрузки пользователей:', error);
        }
    }

    // Загрузка диалогов
    function loadConversations(userId) {
        const conversationsQuery = query(
            collection(db, "conversations"),
            where("participants", "array-contains", userId)
        );
        
        return onSnapshot(conversationsQuery, (snapshot) => {
            dmList.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const convData = doc.data();
                const otherUserId = convData.participants.find(id => id !== userId);
                const otherUser = allUsers.find(u => u.uid === otherUserId) || { displayName: 'Пользователь', email: '' };
                
                conversations[doc.id] = {
                    id: doc.id,
                    otherUserId,
                    otherUserName: otherUser.displayName || otherUser.email,
                    lastMessage: convData.lastMessage || '',
                    lastMessageTime: convData.lastMessageTime,
                    unreadCount: convData[`unread_${userId}`] || 0
                };
                
                const conv = conversations[doc.id];
                const timeStr = conv.lastMessageTime?.toDate ? 
                    conv.lastMessageTime.toDate().toLocaleString() : '';
                
                const dmItem = document.createElement('div');
                dmItem.className = `dm-item ${conv.unreadCount > 0 ? 'unread' : ''}`;
                dmItem.onclick = () => openChat(conv.otherUserId, conv.otherUserName);
                
                dmItem.innerHTML = `
                    <div class="dm-header">
                        <span class="dm-sender">${conv.otherUserName}</span>
                        <span class="dm-time">${timeStr}</span>
                    </div>
                    <div class="dm-preview">
                        ${conv.lastMessage || 'Нет сообщений'}
                        ${conv.unreadCount > 0 ? `<span class="unread-badge">${conv.unreadCount}</span>` : ''}
                    </div>
                `;
                
                dmList.appendChild(dmItem);
            });
        });
    }

    // Открыть чат
    async function openChat(userId, userName) {
        currentChatUserId = userId;
        currentChatUserName = userName;
        dmModalTitle.textContent = `Чат с ${userName}`;
        dmModal.style.display = 'block';
        
        // Загружаем сообщения
        await loadMessages(userId);
    }

    // Загрузка сообщений
    async function loadMessages(otherUserId) {
        const currentUserId = auth.currentUser?.uid;
        if (!currentUserId || !otherUserId) return;
        
        // Находим или создаем conversationId
        const conversationId = [currentUserId, otherUserId].sort().join('_');
        
        const messagesQuery = query(
            collection(db, "messages", conversationId, "chat"),
            orderBy("timestamp", "asc")
        );
        
        onSnapshot(messagesQuery, (snapshot) => {
            dmMessages.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const msg = doc.data();
                const messageClass = msg.senderId === currentUserId ? 'sent' : 'received';
                const timeStr = msg.timestamp?.toDate ? 
                    msg.timestamp.toDate().toLocaleString() : '';
                
                const messageEl = document.createElement('div');
                messageEl.className = `dm-message ${messageClass}`;
                messageEl.innerHTML = `
                    <div>${msg.text}</div>
                    <div class="dm-message-time">${timeStr}</div>
                `;
                
                dmMessages.appendChild(messageEl);
            });
            
            // Прокрутка вниз
            dmMessages.scrollTop = dmMessages.scrollHeight;
        });
        
        // Отмечаем сообщения как прочитанные
        await markMessagesAsRead(conversationId, otherUserId);
    }

    // Отметить сообщения как прочитанные
    async function markMessagesAsRead(conversationId, otherUserId) {
        const currentUserId = auth.currentUser?.uid;
        if (!currentUserId) return;
        
        const convRef = doc(db, "conversations", conversationId);
        await updateDoc(convRef, {
            [`unread_${currentUserId}`]: 0
        });
    }

    // Отправить сообщение
    async function sendMessage() {
        const text = dmInput.value.trim();
        if (!text || !currentChatUserId) return;
        
        const currentUserId = auth.currentUser?.uid;
        const conversationId = [currentUserId, currentChatUserId].sort().join('_');
        
        try {
            // Сохраняем сообщение
            await addDoc(collection(db, "messages", conversationId, "chat"), {
                senderId: currentUserId,
                receiverId: currentChatUserId,
                text: text,
                timestamp: serverTimestamp(),
                read: false
            });
            
            // Обновляем информацию о диалоге
            const convRef = doc(db, "conversations", conversationId);
            const convDoc = await getDoc(convRef);
            
            if (convDoc.exists()) {
                await updateDoc(convRef, {
                    lastMessage: text,
                    lastMessageTime: serverTimestamp(),
                    [`unread_${currentChatUserId}`]: increment(1)
                });
            } else {
                await setDoc(convRef, {
                    participants: [currentUserId, currentChatUserId],
                    lastMessage: text,
                    lastMessageTime: serverTimestamp(),
                    [`unread_${currentUserId}`]: 0,
                    [`unread_${currentChatUserId}`]: 1,
                    createdAt: serverTimestamp()
                });
            }
            
            dmInput.value = '';
        } catch (error) {
            console.error('Ошибка отправки:', error);
            alert('Не удалось отправить сообщение');
        }
    }

    // Отправить новое DM
    sendDmBtn.addEventListener('click', async () => {
        const recipientId = dmRecipient.value;
        const message = dmMessage.value.trim();
        
        if (!recipientId || !message) {
            alert('Выберите получателя и введите сообщение');
            return;
        }
        
        const recipient = allUsers.find(u => u.uid === recipientId);
        currentChatUserId = recipientId;
        currentChatUserName = recipient?.displayName || recipient?.email || 'Пользователь';
        
        await sendMessage();
        
        dmMessage.value = '';
        dmRecipient.value = '';
        newDmTab.click();
        dmListTab.click();
    });

    // Переключение вкладок DM
    dmListTab.addEventListener('click', () => {
        dmListTab.classList.add('active');
        newDmTab.classList.remove('active');
        dmListContainer.style.display = 'block';
        newDmContainer.style.display = 'none';
    });

    newDmTab.addEventListener('click', () => {
        newDmTab.classList.add('active');
        dmListTab.classList.remove('active');
        dmListContainer.style.display = 'none';
        newDmContainer.style.display = 'block';
    });

    // Закрыть модальное окно
    window.closeDmModal = function() {
        dmModal.style.display = 'none';
        currentChatUserId = null;
    };

    // Отправка сообщения из модального окна
    sendMessageBtn.addEventListener('click', sendMessage);
    dmInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    // Отправка вопроса
    submitBtn.addEventListener('click', async () => {
        if (!auth.currentUser) {
            alert('Необходимо войти в систему');
            return;
        }

        const name = nameInput.value.trim();
        const message = messageInput.value.trim();
        
        if (!name || !message) {
            alert('Заполните имя и вопрос');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Отправка...';

        try {
            let imageUrl = null;
            
            const imageFile = imageUpload.files[0];
            if (imageFile) {
                const storageRef = ref(storage, `images/${Date.now()}_${imageFile.name}`);
                await uploadBytes(storageRef, imageFile);
                imageUrl = await getDownloadURL(storageRef);
            }

            await addDoc(collection(db, "requests"), {
                name: name,
                message: message,
                imageUrl: imageUrl,
                userId: auth.currentUser.uid,
                userEmail: auth.currentUser.email,
                likes: 0,
                timestamp: serverTimestamp()
            });

            nameInput.value = '';
            messageInput.value = '';
            imageUpload.value = '';
            imagePreview.style.display = 'none';
            
        } catch (e) { 
            console.error('Ошибка:', e);
            alert('Ошибка безопасности. Данные отключены сервером.'); 
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '📤 Отправить вопрос';
        }
    });

    // Лайки
    window.processLike = async (docId) => {
        if (!auth.currentUser) {
            alert('Необходимо войти в систему');
            return;
        }
        
        try {
            const postRef = doc(db, "requests", docId);
            await updateDoc(postRef, {
                likes: increment(1)
            });
        } catch (error) {
            console.error('Ошибка при лайке:', error);
            alert('Не удалось поставить лайк');
        }
    };

    // Открыть DM из поста
    window.openDmFromPost = (userId, userName) => {
        if (!auth.currentUser) {
            alert('Необходимо войти в систему');
            return;
        }
        openChat(userId, userName);
    };

    // Загрузка постов
    const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));
    onSnapshot(q, (snapshot) => {
        feed.innerHTML = "";
        snapshot.forEach((doc) => {
            const data = doc.data();
            
            let timeStr = 'Только что';
            if (data.timestamp?.toDate) {
                const date = data.timestamp.toDate();
                timeStr = date.toLocaleTimeString() + ' ' + date.toLocaleDateString();
            }

            const postHTML = `
            <div class="post" data-id="${doc.id}">
                <div class="post-header">
                    <span class="post-author" onclick="openDmFromPost('${data.userId || ''}', '${data.name || 'Пользователь'}')">${data.name || 'Аноним'}</span>
                    <span class="post-time">${timeStr}</span>
                </div>
                <div class="post-content">${data.message || ''}</div>
                ${data.imageUrl ? `<img src="${data.imageUrl}" class="post-image" alt="Post image">` : ''}
                <div class="post-actions">
                    <button class="like-btn" onclick="processLike('${doc.id}')">
                        ❤️ ${data.likes || 0}
                    </button>
                    ${data.userId && data.userId !== auth.currentUser?.uid ? 
                        `<button class="dm-btn" onclick="openDmFromPost('${data.userId}', '${data.name || 'Пользователь'}')">
                            💬 Написать
                        </button>` : ''}
                    <span style="color: #666; font-size: 12px;">${data.userEmail || ''}</span>
                </div>
            </div>
            `;
            
            feed.innerHTML += postHTML;
        });
    });
    
    // Закрытие модального окна по клику вне его
    window.onclick = function(event) {
        if (event.target === dmModal) {
            closeDmModal();
        }
    };
</script>

</body>
</html>
